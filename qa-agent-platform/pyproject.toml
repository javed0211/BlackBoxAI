[project]
name = "qa-agent-platform"
version = "0.1.0"
description = "QA-first agentic CLI platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "aiosqlite>=0.20.0",
    "playwright>=1.40.0",
    "httpx>=0.26.0",
    "orjson>=3.10",
    "tenacity>=8.2"
]

[project.scripts]
qa-agent = "qa_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]
